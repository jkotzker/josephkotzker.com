name: Deploy

on:
  push:
    branches: [main]
  schedule:
    # Daily, to refresh build-time enrichment and pick up resume changes.
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out private resume
        uses: actions/checkout@v7
        with:
          repository: jkotzker/resume
          ssh-key: ${{ secrets.RESUME_DEPLOY_KEY }}
          path: .resume
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The résumé repo's own script; --public-only never reads its contact file. The site serves the
      # result at /resume/joseph-kotzker-resume.pdf when the résumé is public.
      - name: Build the public résumé PDF
        working-directory: .resume
        run: npm ci && npm run build:public

      - name: Check, test, build, verify
        run: npm run ci

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
